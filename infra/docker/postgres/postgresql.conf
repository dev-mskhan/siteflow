# PostgreSQL configuration for local development
# Tuned for a development laptop — NOT for production.

# Connection settings
max_connections = 100

# Memory
shared_buffers = 256MB
work_mem = 4MB
maintenance_work_mem = 64MB

# WAL / replication (needed for logical replication / pgvector)
wal_level = logical
max_wal_senders = 3
wal_keep_size = 64MB

# Logging — verbose for dev
log_statement = 'all'
log_duration = on
log_min_duration_statement = 100   # log queries > 100 ms

# Timezone
timezone = 'UTC'
