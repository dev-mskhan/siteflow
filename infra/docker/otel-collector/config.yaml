# ─────────────────────────────────────────────────────────────────────────────
# OTEL Collector configuration for SiteFlow
# Receives OTLP from the app, forwards to SigNoz (ClickHouse).
# ─────────────────────────────────────────────────────────────────────────────

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: '0.0.0.0:4317'
      http:
        endpoint: '0.0.0.0:4318'
        cors:
          allowed_origins:
            - 'http://localhost:3000'
            - 'http://localhost:3001'

  hostmetrics:
    collection_interval: 30s
    scrapers:
      cpu:
        metrics:
          system.cpu.utilization:
            enabled: true
      memory:
        metrics:
          system.memory.utilization:
            enabled: true
      disk: {}
      network: {}
      load: {}
      filesystem:
        metrics:
          system.filesystem.utilization:
            enabled: true
      processes: {}

processors:
  batch:
    send_batch_size: 10000
    send_batch_max_size: 11000
    timeout: 10s

  memory_limiter:
    check_interval: 5s
    limit_mib: 400
    spike_limit_mib: 100

  resourcedetection:
    detectors: [env, system]
    timeout: 5s

exporters:
  # Traces exporter
  clickhousetraces:
    datasource: tcp://siteflow-signoz-clickhouse:9000?database=signoz_traces&username=default&password=

  # Metrics exporter (receives both app-pushed metrics AND span-derived RED metrics)
  signozclickhousemetrics:
    dsn: tcp://siteflow-signoz-clickhouse:9000?database=signoz_metrics&username=default&password=

  # Logs exporter
  clickhouselogsexporter:
    dsn: tcp://siteflow-signoz-clickhouse:9000?database=signoz_logs&username=default&password=

  # Debug exporter — prints telemetry to collector stdout in dev
  debug:
    verbosity: detailed
    sampling_initial: 5
    sampling_thereafter: 200

# ─── Connectors ───────────────────────────────────────────────────────────────
# spanmetrics derives RED metrics (Rate/Error/Duration) from trace spans.
# It acts as both an exporter (receives from traces pipeline) and a receiver
# (feeds into the metrics pipeline). Required for SigNoz Services overview.
connectors:
  spanmetrics:
    histogram:
      explicit:
        buckets:
          [
            2ms,
            4ms,
            6ms,
            8ms,
            10ms,
            50ms,
            100ms,
            250ms,
            500ms,
            1000ms,
            1400ms,
            2000ms,
            5000ms,
            10000ms,
            20000ms,
            40000ms,
            60000ms,
          ]
    dimensions:
      - name: service.namespace
        default: default
      - name: deployment.environment
        default: default
    exemplars:
      enabled: true

extensions:
  health_check:
    endpoint: '0.0.0.0:13133'
  pprof:
    endpoint: '0.0.0.0:1777'
  zpages:
    endpoint: '0.0.0.0:55679'

service:
  extensions: [health_check, pprof, zpages]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection, batch]
      # spanmetrics is an exporter here — it reads spans to derive metrics
      exporters: [clickhousetraces, spanmetrics, debug]
    metrics:
      # spanmetrics is a receiver here — it feeds derived RED metrics in
      receivers: [otlp, spanmetrics, hostmetrics]
      processors: [memory_limiter, resourcedetection, batch]
      exporters: [signozclickhousemetrics, debug]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection, batch]
      exporters: [clickhouselogsexporter, debug]
