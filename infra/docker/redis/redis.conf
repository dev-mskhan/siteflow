# Redis configuration for local development

# Persistence — RDB snapshots
save 900 1
save 300 10
save 60 10000

# Memory
maxmemory 256mb
maxmemory-policy allkeys-lru

# Append-only file for durability
appendonly yes
appendfsync everysec

# Network
bind 0.0.0.0
protected-mode no

# Logging
loglevel notice
